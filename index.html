<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>別多付-購物金額統計</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Total Section（置頂，避開狀態列） -->
            <section id="totalSection" class="total-section" style="display: none;">
                <div class="total-wrapper">
                    <span class="total-label">總金額</span>
                    <span id="totalAmount" class="total-amount">$0</span>
                </div>
            </section>

            <!-- Shopping List -->
            <section id="shoppingListSection" class="shopping-list-section" style="display: none;">
                <div class="section-header">
                    <h2>購物清單</h2>
                    <button id="clearAllBtn" class="btn-clear-all">清空清單</button>
                </div>

                <div id="shoppingList" class="shopping-list">
                    <!-- Products will be dynamically added here -->
                </div>
            </section>

            <!-- Camera Button（底部正中央） -->
            <div class="camera-section">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                <button id="cameraBtn" class="btn-camera">
                    <span class="btn-camera-icon" aria-hidden="true">📷</span>
                    <span>新增商品</span>
                </button>
            </div>
        </main>

        <!-- Product Edit Modal（新增／編輯共用） -->
        <div id="editProductModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="editModalTitle">編輯商品</h3>
                    <button class="btn-close" id="closeEditBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="product-photo-preview">
                        <img id="editPhotoPreview" src="" alt="商品照片" title="點擊查看完整圖片">
                    </div>

                    <div class="form-group">
                        <label for="editPromotionType">特價活動</label>
                        <select id="editPromotionType" class="form-select">
                            <option value="none">無特價</option>
                            <option value="buy_one_get_one">買一送一</option>
                            <option value="buy_two_get_one">買二送一</option>
                            <option value="second_half">第二件半價</option>
                            <option value="bulk_discount">X個Y元</option>
                            <option value="custom_subtotal">自訂小計</option>
                        </select>
                    </div>

                    <div class="form-group" id="editCustomSubtotalGroup" style="display: none;">
                        <label for="editCustomSubtotal">自訂小計 (元)</label>
                        <input type="number" id="editCustomSubtotal" class="form-input" placeholder="請輸入自訂小計金額" step="1"
                            min="1" inputmode="numeric">
                        <div class="validation-error" id="editCustomSubtotalError"></div>
                        <small class="form-hint">適用於非內建特價規則，如買三送一</small>
                    </div>

                    <div class="form-group" id="editBulkDiscountGroup" style="display: none;">
                        <label>X個Y元設定</label>
                        <div class="bulk-discount-row">
                            <div class="bulk-discount-field">
                                <div class="bulk-discount-input-wrap">
                                    <input type="number" id="editBulkQuantity" class="form-input" placeholder="X (數量)"
                                        min="1" step="1" inputmode="numeric">
                                    <span>個</span>
                                </div>
                                <div class="validation-error" id="editBulkQuantityError"></div>
                            </div>
                            <div class="bulk-discount-field">
                                <div class="bulk-discount-input-wrap">
                                    <input type="number" id="editBulkPrice" class="form-input" placeholder="Y (價格)"
                                        min="1" step="1" inputmode="numeric">
                                    <span>元</span>
                                </div>
                                <div class="validation-error" id="editBulkPriceError"></div>
                            </div>
                        </div>
                        <small class="form-hint">例如: 3個100元</small>
                    </div>

                    <div class="form-row-2col">
                        <div class="form-group" id="editProductQuantityGroup">
                            <label for="editProductQuantity">數量</label>
                            <input type="number" id="editProductQuantity" class="form-input" value="1" min="1" step="1"
                                inputmode="numeric" required>
                            <div class="validation-error" id="editQuantityError"></div>
                        </div>
                        <div class="form-group" id="editProductPriceGroup">
                            <label for="editProductPrice">單價 (元)</label>
                            <input type="number" id="editProductPrice" class="form-input" placeholder="請輸入價格" step="1"
                                min="1" inputmode="numeric" required>
                            <div class="validation-error" id="editPriceError"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editProductName">品名</label>
                        <input type="text" id="editProductName" class="form-input" placeholder="請輸入商品名稱" required>
                        <div class="validation-error" id="editNameError"></div>
                    </div>

                    <div class="validation-error form-actions-error" id="editAmountError"></div>

                    <div class="form-actions">
                        <button id="cancelEditBtn" class="btn-secondary">取消</button>
                        <button id="confirmEditBtn" class="btn-primary">儲存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Full Image Viewer -->
        <div id="fullImageModal" class="modal">
            <div class="full-image-content">
                <button type="button" class="btn-close full-image-close" id="closeFullImageBtn"
                    aria-label="關閉">&times;</button>
                <img id="fullImageView" src="" alt="完整商品照片">
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>
    </div>

    <script src="product-manager.js"></script>
    <script src="price-calculator.js"></script>
    <script src="app.js"></script>
</body>

</html>
