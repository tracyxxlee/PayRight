# 在 GitHub Actions 建置 Android Debug APK，並上傳為可下載的 Artifact。
name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets to Android (Capacitor)
        run: npm run cap:sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Runner 已內建 SDK；只需把 cmdline-tools 加入 PATH（勿用 setup-android@v3，會安裝已下架的 tools 套件）
      - name: Configure Android SDK
        run: |
          ANDROID_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_ROOT}" >> "$GITHUB_ENV"
          if [ -x "${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${ANDROID_ROOT}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "sdkmanager not found under ${ANDROID_ROOT}/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
          echo "${ANDROID_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=${SDKMANAGER}" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: payright-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
